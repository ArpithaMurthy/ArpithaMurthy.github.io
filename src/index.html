<!doctype html>

    <meta name="description" content="Arpitha Murthy — software engineer, curious builder, and lifelong learner." />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>Arpitha Murthy — Building with intention</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
