<path class="line" d="M560 652 V689 H560 V718"/>
<path class="line" d="M900 652 V689 H560 V718"/>
<path class="line" d="M560 822 V859 H560 V888"/>
  <g>
      <rect class="node" x="340" y="46" width="440" height="96" rx="7"/>
      <text class="step" x="560" y="85"><tspan x="560" dy="0">Traveler, provider, operator, and support</tspan><tspan x="560" dy="22">apps</tspan></text>
      
    </g>
<g>
      <rect class="node" x="340" y="216" width="440" height="96" rx="7"/>
      <text class="step" x="560" y="266"><tspan x="560" dy="0">Identity and journey APIs</tspan></text>
      
    </g>
<g>
