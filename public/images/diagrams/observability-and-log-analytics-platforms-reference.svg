<path class="line" d="M560 652 V689 H900 V718"/>
<path class="line" d="M220 822 V859 H560 V888"/>
<path class="line" d="M560 822 V859 H560 V888"/>
<path class="line" d="M900 822 V859 H560 V888"/>
  <g>
      <rect class="node" x="340" y="46" width="440" height="96" rx="7"/>
      <text class="step" x="560" y="96"><tspan x="560" dy="0">Network elements, services, and devices</tspan></text>
      
    </g>
<g>
